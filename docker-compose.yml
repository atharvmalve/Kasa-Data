services:
  yugabytedb:
    image: yugabytedb/yugabyte:2024.1.3.0-b105
    container_name: kasa-yugabyte
    command: >
      bin/yugabyted start
      --base_dir=/home/yugabyte/yb_data
      --daemon=false
      --tserver_flags=pgsql_proxy_bind_address=0.0.0.0:5433
    ports:
      - "5433:5433"
      - "15433:15433"
      - "7000:7000"
      - "9000:9000"
    volumes:
      - kasa_yb_data:/home/yugabyte/yb_data
    restart: unless-stopped

volumes:
  kasa_yb_data:
